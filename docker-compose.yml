services:
  postgres:
    image: postgres:16-alpine
    container_name: librosphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - librosphere-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librosphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/library
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 5F05gEkmG5Gxi6GHqehXUFlsusNdoO0tXnwuK1iUVpQ=
      JWT_REFRESH_EXPIRATION_MS: 604800000
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - librosphere-network

networks:
  librosphere-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
